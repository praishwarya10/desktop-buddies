
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    pointer-events: none;
    user-select: none;
  }

  #scene {
    position: relative;
    width: 330px;
    height: 620px;
    transform-origin: top left;
    pointer-events: none;
  }

  /* The web is anchored to the top */
  #hanger {
    position: absolute;
    top: 0;
    left: 165px;
    width: 0;
    height: 0;
  }

  /* Whole illustration swings from the top */
  #swing {
    position: absolute;
    top: 0;
    left: 0;
    width: 0;
    height: 0;
    transform-origin: 0 0;
    will-change: transform;
  }

  #spiderman {
    position: absolute;
    top: 0;
    left: -85px;
    width: 170px;
    height: auto;
    display: block;
    filter: drop-shadow(2px 4px 3px rgba(0,0,0,.18));
  }
  #webString {
  position: absolute;
  left: -1px;
  top: 0;
  width: 2px;
  height: 0;
  background: repeating-linear-gradient(
    to bottom,
    #b8c3ce 0px,
    #eef3f8 5px,
    #8d9ba8 9px
  );
  transform-origin: top center;
}

#spiderman {
  transition: top 0.65s cubic-bezier(.22,1.3,.36,1);
}
</style>
</head>

<body>

<div id="scene">
  <div id="hanger">
    <div id="swing">
      <div id="webString"></div>
      <img
        id="spiderman"
        src="./spiderman.png"
        alt="Spider-Man hanging upside down"
        draggable="false"
      >
    </div>
  </div>
</div>

<script>
const scene = document.getElementById("scene");
const swing = document.getElementById("swing");

let scale = 0.4;
let mouse = { x: -1000, y: -1000 };

// Keep existing size settings
window.desktopBuddy.getSize().then(value => {
  scale = value;
  scene.style.transform = `scale(${scale})`;
});

window.desktopBuddy.onSize(value => {
  scale = value;
  scene.style.transform = `scale(${scale})`;
});

// Receive mouse position from Electron
window.desktopBuddy.onCursor(position => {
  mouse = position;
});


let angle = 0;
let velocity = 0;
let lastFrame = performance.now();
let time = 0;

const spider = document.getElementById("spiderman");
const webString = document.getElementById("webString");

const DROP_DISTANCE = 130;
const RETURN_DELAY = 2000;

let drop = 0;
let dropVelocity = 0;
let dropTarget = 0;
let returnAt = 0;
let armed = true;
let previousNear = false;

function animate(now) {
  const dt = Math.min((now - lastFrame) / 1000, 0.04);
  lastFrame = now;
  time += dt;

  const centerX = 165 * scale;
  const centerY = (150 + drop) * scale;

  const distance = Math.hypot(
    mouse.x - centerX,
    mouse.y - centerY
  );

  const near = distance < 65 * scale;

  // Trigger only when cursor first approaches
  if (near && !previousNear && armed) {
    dropTarget = DROP_DISTANCE;
    returnAt = now + RETURN_DELAY;
    armed = false;
  }

  // Automatically climb back after 2 seconds
  if (returnAt && now >= returnAt) {
    dropTarget = 0;
    returnAt = 0;
  }

  // Allow a new drop after the cursor leaves
  if (!near && drop < 2 && dropTarget === 0) {
    armed = true;
  }

  previousNear = near;

  // Smooth elastic drop and return
  const dropAcceleration =
    (dropTarget - drop) * 28 - dropVelocity * 9;

  dropVelocity += dropAcceleration * dt;
  drop += dropVelocity * dt;

  // Extend web and move the illustration together
  spider.style.top = `${drop}px`;
  webString.style.height = `${drop}px`;

  // Gentle swinging
  const idle = Math.sin(time * 1.8) * 12;

  const proximity = Math.max(
    0,
    1 - distance / (150 * scale)
  );

  const direction = mouse.x > centerX ? -1 : 1;
  const mouseForce = proximity * direction * 8;

  const target = idle + mouseForce;

  const acceleration =
    (target - angle) * 18 - velocity * 6;

  velocity += acceleration * dt;
  angle += velocity * dt;

  swing.style.transform =
    `rotate(${angle.toFixed(2)}deg)`;

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);

</script>

</body>
</html>
