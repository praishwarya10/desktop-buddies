<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;background:#121923;color:#f5f7fb;font:15px 'Segoe UI',sans-serif;padding:26px}h2{margin:0 0 9px;font-size:23px}.sub{color:#aab6c8;line-height:1.5;margin:0 0 26px}.control{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}#value{font-size:20px;color:#ffda4a;font-weight:700}input{width:100%;accent-color:#ffda4a;cursor:pointer}.ends{display:flex;justify-content:space-between;color:#9ba9bd;font-size:12px;margin-top:9px}.hint{background:#202b3a;border-radius:12px;padding:14px;margin-top:22px;color:#cbd5e1;font-size:13px;line-height:1.7}kbd{background:#334155;border-radius:4px;padding:2px 5px}</style></head><body>
<h2>💛 Desktop Buddies</h2><p class="sub">Make your little companions fit your workspace.</p>
<div class="control"><strong>Character size</strong><span id="value">40%</span></div>
<input id="scale" type="range" min="20" max="120" step="5" value="40" aria-label="Character size"><div class="ends"><span>Tiny · 20%</span><span>Large · 120%</span></div>
<div class="hint">Changes apply instantly and are saved automatically.<br><kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>S</kbd> settings<br><kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>H</kbd> hide/show<br><kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>Q</kbd> quit</div>
<script>const slider=document.querySelector('#scale'),value=document.querySelector('#value');function update(n){slider.value=Math.round(n*100);value.textContent=Math.round(n*100)+'%'}window.desktopBuddy.getSize().then(update);slider.addEventListener('input',()=>{value.textContent=slider.value+'%';window.desktopBuddy.setSize(Number(slider.value)/100)});window.desktopBuddy.onSize(update)</script></body></html>
